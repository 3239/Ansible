- name: Install and configure ClickHouse
  hosts: clickhouse
  become: true
  tags:
    - clickhouse
  roles:
    - role: clickhouse

- name: Install and configure Vector
  hosts: vector
  become: true
  tags:
    - vector
  roles:
    - role: vector-role

- name: Install and configure LightHouse
  hosts: lighthouse
  become: true
  tags:
    - lighthouse
  roles:
    - role: lighthouse-role

  tasks:
    - name: Create test table in ClickHouse for LightHouse
      ansible.builtin.command: >
        clickhouse-client --host {{ hostvars['clickhouse-01']['ansible_host'] }}
        -q "CREATE TABLE IF NOT EXISTS logs.test (message String) ENGINE = Memory"
      register: create_table
      failed_when: create_table.rc != 0 and create_table.rc != 82
      changed_when: create_table.rc == 0
      check_mode: false